name: Build and verify

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TURBORAMA_SKIP_NETWORK_TESTS: "1"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.400

      - name: Record runner image
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "ImageVersion=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Build and gate unsigned evidence
        shell: pwsh
        run: .\tools\Build-Production.ps1 -UnsignedStaging -OutputRoot .\artifacts -DotNetPath dotnet

      - name: Upload unsigned CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Turborama-win-x64-unsigned-${{ github.sha }}
          path: artifacts/Turborama-*-UNSIGNED-NOT-FOR-DISTRIBUTION/
          if-no-files-found: error
          retention-days: 7
